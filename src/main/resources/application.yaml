spring:
  application:
    name: equipo10
  datasource:
    url: jdbc:postgresql://localhost:5432/facturacion_db_spring
    username: postgres
    password: ${PASSWORD_DB}
    driver-class-name: org.postgresql.Driver
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
